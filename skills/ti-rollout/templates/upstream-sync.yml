# 配布用の受け皿（顧客の private 複製リポジトリ）に .github/workflows/upstream-sync.yml として置く。
# 役割は 3 つ。
#   (1) 上流（ツバイソの公開リポジトリ）に新しい版が出たら追従 PR を立てる
#   (2) AUTO_MERGE=true（既定）のとき、その PR を自動でマージする
#   (3) マージできないまま滞留していたら PR にコメントで知らせる
# 反映は必ず PR のマージで行う。組織マーケットプレイスの自動同期が
# 「版上げを含む PR が既定ブランチへマージされたとき」にしか発火せず、
# 既定ブランチへの直接 push では発火しないため。
# 置いたあとリポジトリの Settings > Actions > General > Workflow permissions で
# 「Allow GitHub Actions to create and approve pull requests」を有効にすること。
name: Tsubaiso Intelligence の追従

on:
  schedule:
    # 毎日 1 回（00:23 UTC = 09:23 JST）。時刻は保証されない。
    # GitHub の scheduled は混雑時に遅れる（当社の受け皿で約 5 時間の遅れと、
    # 当日発火しなかった日を実測）。毎時 00 分はもっとも混む枠なので分をずらしている。
    # 新しい版を今すぐ反映したいときは Actions の「Run workflow」で手動実行する。
    - cron: '23 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/tsubaiso/tsubaiso-intelligence.git
  # gh の操作対象をこの受け皿に固定する。差分判定のために追加するリモート名 upstream を
  # gh は origin より優先して基準リポジトリに選ぶため、これが無いと PR を上流の公開リポジトリへ
  # 作ろうとして Resource not accessible by integration で落ちる。権限の問題に見えるが権限ではない。
  GH_REPO: ${{ github.repository }}
  SYNC_BRANCH: sync/upstream
  BASE_BRANCH: main
  # 追従 PR がこの日数マージされないまま滞留したら PR にコメントで知らせる。
  STALE_DAYS: '7'
  # 一度知らせたあと、次に知らせるまでの間隔（日）。滞留のしきい値とは別に調整できる。
  RENOTIFY_DAYS: '7'
  # 追従 PR を自動でマージするか。
  #   'true'（既定）= 立てた PR をそのままマージして配る。管理者の手作業が要らない。
  #                   配る判断は「上流を信頼する」という一度の決定に置き換わる。
  #   'false'       = PR を立てるところまでにして、配る版を毎回管理者が決める。
  # 'true' でもマージできないとき（競合・ブランチ保護のレビュー必須など）は
  # PR が open のまま残るので、気づかないまま壊れた状態が配られることはない。
  AUTO_MERGE: 'true'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 複製を取得
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 上流を取得
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream main

      - name: 追従すべき差分があるか判定
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "上流に新しい内容はありません。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(git show upstream/main:.claude-plugin/plugin.json | jq -r .version)
            echo "上流の版: ${VERSION}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: 追従ブランチを更新
        if: steps.check.outputs.changed == 'true'
        run: git push --force origin "upstream/main:refs/heads/${SYNC_BRANCH}"

      - name: 追従 PR を作成（既にあればタイトルを版に追随させる）
        id: pr
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          EXISTING=$(gh pr list --head "$SYNC_BRANCH" --state open --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "既存の追従 PR #${EXISTING} があります。ブランチを更新し、タイトルを v${VERSION} へ揃えます。"
            # 先に番号を出力してからタイトルを更新する。順序が逆だと、タイトル更新が
            # 一時エラーで落ちたときに番号が出力されず、その回のマージまで飛ぶ。
            echo "number=${EXISTING}" >> "$GITHUB_OUTPUT"
            # 既存 PR は使い回されるため、タイトルを更新しないと立てた時点の版が残り続ける。
            # 中身は最新なのにタイトルが古いという状態は、管理者が「もう見た PR」と読み飛ばす原因になる。
            # ただしタイトルは表示の問題なので、失敗しても配ることを止めない。
            gh pr edit "$EXISTING" --title "Tsubaiso Intelligence Skill v${VERSION} に追従" \
              || echo "タイトルの更新に失敗しました。マージは続けます。"
            exit 0
          fi
          {
            echo "公開リポジトリ https://github.com/tsubaiso/tsubaiso-intelligence の更新を取り込みます。"
            echo ""
            echo "この PR をマージすると、組織マーケットプレイスの同期が発火し、利用者へ新しい版が届きます。"
            echo ""
            echo "差分は公開リポジトリの内容そのものです。複製側で独自の変更を加えていない限り、競合は起きません。"
          } > "${RUNNER_TEMP}/pr-body.md"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$SYNC_BRANCH" \
            --title "Tsubaiso Intelligence Skill v${VERSION} に追従" \
            --body-file "${RUNNER_TEMP}/pr-body.md"
          NUMBER=$(gh pr list --head "$SYNC_BRANCH" --state open --json number -q '.[0].number')
          echo "number=${NUMBER}" >> "$GITHUB_OUTPUT"

      - name: 追従 PR をマージする（AUTO_MERGE=true）
        if: steps.check.outputs.changed == 'true' && env.AUTO_MERGE == 'true' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          # マージできない理由（競合・レビュー必須のブランチ保護・必須チェックの失敗）は
          # いずれも人の判断が要るものなので、失敗しても止めず PR を open のまま残す。
          # 次回の実行と滞留通知がそのまま拾う。
          if gh pr merge "$NUMBER" --merge; then
            echo "追従 PR #${NUMBER}（v${VERSION}）をマージしました。組織マーケットプレイスの同期が発火します。"
          else
            echo "追従 PR #${NUMBER} をマージできませんでした。open のまま残し、管理者の判断に回します。"
          fi

      - name: 未マージのまま滞留していたら知らせる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh pr list --head "$SYNC_BRANCH" --state open --json number,createdAt --jq '.[0] // empty')
          if [ -z "$PR" ]; then
            echo "未マージの追従 PR はありません。"
            exit 0
          fi
          NUMBER=$(echo "$PR" | jq -r .number)
          CREATED=$(echo "$PR" | jq -r .createdAt)
          AGE=$(( ( $(date -u +%s) - $(date -u -d "$CREATED" +%s) ) / 86400 ))
          if [ "$AGE" -lt "$STALE_DAYS" ]; then
            echo "滞留 ${AGE} 日。しきい値 ${STALE_DAYS} 日に達していません。"
            exit 0
          fi
          LAST=$(gh pr view "$NUMBER" --json comments --jq '[.comments[] | select(.body | contains("<!-- upstream-sync-stale -->")) | .createdAt] | last // empty')
          if [ -n "$LAST" ]; then
            SINCE=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
            if [ "$SINCE" -lt "$RENOTIFY_DAYS" ]; then
              echo "${SINCE} 日前に知らせ済みです（再通知の間隔 ${RENOTIFY_DAYS} 日）。"
              exit 0
            fi
          fi
          {
            echo "<!-- upstream-sync-stale -->"
            echo "この追従 PR は ${AGE} 日マージされていません。"
            echo ""
            echo "マージされるまで、利用者の手元には新しい版が届きません。利用者からは「できるはずのことができない」という形でしか気づけないため、放置すると原因の分からない不具合として現れます。"
            echo ""
            echo "配る判断はこのリポジトリの管理者にあります。内容を確認してマージするか、見送る場合はその理由をコメントに残してください。"
            echo ""
            echo "**見送る場合も、この PR は open のまま残してください。** close すると次回の実行で同じ PR が作り直され、以後そのたびに新しい PR が立ちます。"
          } > "${RUNNER_TEMP}/stale.md"
          gh pr comment "$NUMBER" --body-file "${RUNNER_TEMP}/stale.md"
